<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/ultimate-fodinha-logo.svg">
    <link rel="apple-touch-icon" href="/ultimate-fodinha-logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E88E5">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ultimate Fodinha 2.0</title>
    <style>
      body { margin: 0; }
      .app-boot {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        gap: 24px;
        padding: 24px;
        background: #fff;
        color: #212121;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .app-boot img { width: 240px; max-width: 100%; height: auto; }
      .app-boot h1 { margin: 0; font-size: 24px; line-height: 1.3; }
      .app-boot p { margin: 0; color: #616161; font-size: 14px; }
      @media (prefers-color-scheme: dark) {
        .app-boot { background: #121212; color: #fff; }
        .app-boot p { color: #bdbdbd; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="app-boot" role="status" aria-live="polite" aria-atomic="true">
        <img src="/gauderio-boot.svg" alt="" width="240" height="240" fetchpriority="high">
        <h1>Ultimate Fodinha 2.0</h1>
        <p data-app-boot-message>Preparando o aplicativo...</p>
        <noscript>Ative o JavaScript para abrir o aplicativo.</noscript>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
